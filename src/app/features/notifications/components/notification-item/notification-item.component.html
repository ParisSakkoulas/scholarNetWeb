<div
  class="group flex items-start gap-3 px-4 py-3 transition-colors hover:bg-surface-100 dark:hover:bg-surface-800"
  [class.bg-blue-50]="!notification().isRead"
>
  <button
    type="button"
    class="flex min-w-0 flex-1 items-start gap-3 text-left"
    (click)="opened.emit(notification())"
  >
    <span class="relative shrink-0">
      @if (notification().actor; as actor) {
        <p-avatar
          [image]="actor.profilePhotoUrl"
          [label]="actor.profilePhotoUrl ? undefined : actorInitials()"
          shape="circle"
          size="large"
        />
      } @else {
        <span
          class="flex h-12 w-12 items-center justify-center rounded-full"
          [class]="meta().color"
        >
          <i [class]="meta().icon" aria-hidden="true"></i>
        </span>
      }
      <!-- small topic badge on the avatar -->
      <span
        class="absolute -bottom-1 -right-1 flex h-5 w-5 items-center justify-center rounded-full border-2 border-white text-[10px]"
        [class]="meta().color"
        [title]="meta().label"
      >
        <i [class]="meta().icon" aria-hidden="true"></i>
      </span>
    </span>

    <span class="min-w-0 flex-1">
      <span
        class="block text-sm text-surface-900 dark:text-surface-0"
        [class.font-semibold]="!notification().isRead"
        >{{ notification().message }}</span
      >
      <span class="mt-0.5 block text-xs text-surface-500">
        {{ meta().label }} · {{ timeAgo() }}
      </span>
    </span>

    @if (!notification().isRead) {
      <span
        class="mt-2 h-2.5 w-2.5 shrink-0 rounded-full bg-blue-600"
        aria-label="Unread"
      ></span>
    }
  </button>

  @if (removable()) {
    <p-button
      icon="pi pi-times"
      [text]="true"
      [rounded]="true"
      size="small"
      severity="secondary"
      ariaLabel="Delete notification"
      styleClass="opacity-0 group-hover:opacity-100 focus:opacity-100"
      (onClick)="removed.emit(notification())"
    />
  }
</div>
