<div class="rich-editor flex h-full flex-col overflow-hidden rounded-xl border border-surface-200 bg-white">
  @if (editable() || commentable()) {
    <div class="flex shrink-0 flex-wrap items-center gap-1 border-b border-surface-200 bg-surface-50 px-2 py-1" role="toolbar" aria-label="Formatting">
      @if (editable()) {
        <p-button icon="pi pi-undo" size="small" variant="text" severity="secondary" ariaLabel="Undo" (onClick)="cmd('undo')" />
        <p-button icon="pi pi-refresh" size="small" variant="text" severity="secondary" ariaLabel="Redo" (onClick)="cmd('redo')" />
        <span class="mx-1 h-5 w-px bg-surface-300" aria-hidden="true"></span>
        <select class="rounded border border-surface-300 bg-white px-1 py-1 text-sm" aria-label="Font" [value]="currentFont()" (change)="setFont($any($event.target).value)">
          <option value="">{{ defaultFont }}</option>
          @for (f of fonts; track f) { <option [value]="f" [style.font-family]="f">{{ f }}</option> }
        </select>
        <select class="rounded border border-surface-300 bg-white px-1 py-1 text-sm" aria-label="Font size" [value]="currentSize()" (change)="setSize($any($event.target).value)">
          <option value="">{{ defaultSize }}</option>
          @for (z of sizes; track z) { <option [value]="z">{{ z }}</option> }
        </select>
        <span class="mx-1 h-5 w-px bg-surface-300" aria-hidden="true"></span>
        <p-button label="H1" size="small" [variant]="is('heading', { level: 1 }) ? 'outlined' : 'text'" severity="secondary" ariaLabel="Heading 1" (onClick)="cmd('toggleHeading', { level: 1 })" />
        <p-button label="H2" size="small" [variant]="is('heading', { level: 2 }) ? 'outlined' : 'text'" severity="secondary" ariaLabel="Heading 2" (onClick)="cmd('toggleHeading', { level: 2 })" />
        <p-button label="H3" size="small" [variant]="is('heading', { level: 3 }) ? 'outlined' : 'text'" severity="secondary" ariaLabel="Heading 3" (onClick)="cmd('toggleHeading', { level: 3 })" />
        <span class="mx-1 h-5 w-px bg-surface-300" aria-hidden="true"></span>
        <p-button label="B" size="small" [variant]="is('bold') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Bold" styleClass="font-bold" (onClick)="cmd('toggleBold')" />
        <p-button label="I" size="small" [variant]="is('italic') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Italic" styleClass="italic" (onClick)="cmd('toggleItalic')" />
        <p-button label="U" size="small" [variant]="is('underline') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Underline" styleClass="underline" (onClick)="cmd('toggleUnderline')" />
        <p-button label="S" size="small" [variant]="is('strike') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Strikethrough" styleClass="line-through" (onClick)="cmd('toggleStrike')" />
        <label class="inline-flex cursor-pointer items-center gap-1 px-1 text-sm" title="Text colour">
          <span class="font-bold underline decoration-2" aria-hidden="true">A</span>
          <input type="color" class="h-5 w-6 cursor-pointer border-0 bg-transparent p-0" aria-label="Text colour" value="#000000" (input)="setColor($event)" />
        </label>
        <label class="inline-flex cursor-pointer items-center gap-1 px-1 text-sm" title="Highlight">
          <i class="pi pi-pencil" aria-hidden="true"></i>
          <input type="color" class="h-5 w-6 cursor-pointer border-0 bg-transparent p-0" aria-label="Highlight colour" value="#fef08a" (input)="setHighlight($event)" />
        </label>
        <p-button icon="pi pi-eraser" size="small" variant="text" severity="secondary" ariaLabel="Remove highlight" (onClick)="clearHighlight()" />
        <p-button label="x₂" size="small" [variant]="is('subscript') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Subscript" (onClick)="cmd('toggleSubscript')" />
        <p-button label="x²" size="small" [variant]="is('superscript') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Superscript" (onClick)="cmd('toggleSuperscript')" />
        <p-button icon="pi pi-link" size="small" [variant]="is('link') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Link" (onClick)="setLink()" />
        <span class="mx-1 h-5 w-px bg-surface-300" aria-hidden="true"></span>
        <p-button icon="pi pi-align-left" size="small" [variant]="isAligned('left') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Align left" (onClick)="align('left')" />
        <p-button icon="pi pi-align-center" size="small" [variant]="isAligned('center') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Align centre" (onClick)="align('center')" />
        <p-button icon="pi pi-align-right" size="small" [variant]="isAligned('right') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Align right" (onClick)="align('right')" />
        <p-button icon="pi pi-align-justify" size="small" [variant]="isAligned('justify') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Justify" (onClick)="align('justify')" />
        <span class="mx-1 h-5 w-px bg-surface-300" aria-hidden="true"></span>
        <p-button icon="pi pi-list" size="small" [variant]="is('bulletList') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Bulleted list" (onClick)="cmd('toggleBulletList')" />
        <p-button icon="pi pi-sort-numeric-down" size="small" [variant]="is('orderedList') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Numbered list" (onClick)="cmd('toggleOrderedList')" />
        <p-button icon="pi pi-comment" size="small" [variant]="is('blockquote') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Quote" (onClick)="cmd('toggleBlockquote')" />
        <p-button icon="pi pi-code" size="small" [variant]="is('codeBlock') ? 'outlined' : 'text'" severity="secondary" ariaLabel="Code block" (onClick)="cmd('toggleCodeBlock')" />
        <p-button icon="pi pi-table" size="small" variant="text" severity="secondary" ariaLabel="Insert table" (onClick)="cmd('insertTable', { rows: 3, cols: 3, withHeaderRow: true })" />
        @if (is('table')) {
          <p-button label="+ row" size="small" variant="text" severity="secondary" (onClick)="cmd('addRowAfter')" />
          <p-button label="+ col" size="small" variant="text" severity="secondary" (onClick)="cmd('addColumnAfter')" />
          <p-button label="Delete table" size="small" variant="text" severity="danger" (onClick)="cmd('deleteTable')" />
        }
        <p-button icon="pi pi-times" size="small" variant="text" severity="secondary" ariaLabel="Clear formatting" title="Clear formatting" (onClick)="clearFormatting()" />
      }
      @if (commentable()) {
        <span class="flex-1"></span>
        <p-button
          label="Comment on selection"
          icon="pi pi-comment"
          size="small"
          [disabled]="!hasSelection()"
          (onClick)="requestComment()"
        />
      }
    </div>
  }
  <div class="rich-editor__canvas">
    <div #host class="rich-editor__page"></div>
    <!-- comments placed level with their text: the parent passes an element marked [margin] -->
    <ng-content select="[margin]" />
  </div>
</div>
