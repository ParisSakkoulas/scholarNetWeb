<p-dialog
  [visible]="true"
  [modal]="true"
  [closable]="false"
  [style]="{ width: '42rem', maxWidth: '95vw' }"
  [header]="isEdit ? 'Edit circle' : 'New writing circle'"
>
  <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">
    <div>
      <label class="mb-1 block text-sm font-medium text-surface-700" for="c-name">Name</label>
      <input id="c-name" pInputText formControlName="name" class="w-full" placeholder="e.g. Tuesday thesis writers" />
    </div>

    <div>
      <label class="mb-1 block text-sm font-medium text-surface-700" for="c-desc">Description</label>
      <textarea id="c-desc" pTextarea formControlName="description" rows="3" class="w-full"
        placeholder="Who is this for, and how do you work together?"></textarea>
    </div>

    <div class="grid gap-4 sm:grid-cols-2">
      <div>
        <label class="mb-1 block text-sm font-medium text-surface-700" for="c-field">Research field</label>
        <input id="c-field" pInputText formControlName="field" class="w-full" placeholder="e.g. Computer science" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-surface-700">Stage</label>
        <p-select formControlName="stage" [options]="stageOptions" optionLabel="label" optionValue="value"
          styleClass="w-full" appendTo="body" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-surface-700">Who can join</label>
        <p-select formControlName="visibility" [options]="visibilityOptions" optionLabel="label" optionValue="value"
          styleClass="w-full" appendTo="body" />
      </div>
      <div>
        <label class="mb-1 block text-sm font-medium text-surface-700">Max members (2 to {{ maxLimit }})</label>
        <p-inputnumber formControlName="maxMembers" [min]="2" [max]="maxLimit" [showButtons]="true" styleClass="w-full" />
      </div>
    </div>

    <fieldset class="m-0 rounded-lg border border-surface-200 p-3">
      <legend class="px-1 text-sm font-medium text-surface-700">Weekly schedule</legend>
      <div class="grid gap-4 sm:grid-cols-3">
        <div>
          <label class="mb-1 block text-xs text-surface-500">Day</label>
          <p-select formControlName="weekday" [options]="weekdayOptions" optionLabel="label" optionValue="value"
            styleClass="w-full" appendTo="body" />
        </div>
        <div>
          <label class="mb-1 block text-xs text-surface-500" for="c-time">Start time</label>
          <input id="c-time" type="time" pInputText formControlName="time" class="w-full" />
        </div>
        <div>
          <label class="mb-1 block text-xs text-surface-500" for="c-dur">Duration (minutes)</label>
          <p-inputnumber inputId="c-dur" formControlName="durationMin" [min]="15" [max]="240" [step]="15"
            [showButtons]="true" styleClass="w-full" />
        </div>
      </div>
      <div class="mt-3">
        <label class="mb-1 block text-xs text-surface-500">Time zone of the schedule (daylight saving is handled for you)</label>
        <p-select formControlName="timezone" [options]="timezones" [filter]="true" styleClass="w-full"
          appendTo="body" />
      </div>
    </fieldset>

    <div>
      <label class="mb-1 block text-sm font-medium text-surface-700" for="c-url">Meeting link (Zoom, Meet, Jitsi...)</label>
      <input id="c-url" pInputText formControlName="meetingUrl" class="w-full" placeholder="https://" />
      <p class="m-0 mt-1 text-xs text-surface-500">Only members see this link. ScholarNet does not host video.</p>
    </div>

    @if (error()) {
      <p class="m-0 text-sm text-red-600">{{ error() }}</p>
    }

    <div class="flex justify-end gap-2 pt-1">
      <p-button type="button" label="Cancel" severity="secondary" [text]="true" (click)="cancelled.emit()" />
      <p-button type="submit" [label]="isEdit ? 'Save' : 'Create circle'" [disabled]="form.invalid || submitting()"
        [loading]="submitting()" />
    </div>
  </form>
</p-dialog>
