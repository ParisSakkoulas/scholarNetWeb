@if (invitations().length) {
  <section
    class="mb-6 rounded-xl border border-blue-200 bg-blue-50 p-4"
    aria-label="Team invitations"
  >
    <h2 class="mb-3 flex items-center gap-2 text-base font-semibold text-blue-900">
      <i class="pi pi-envelope" aria-hidden="true"></i>
      Invitations
      <span class="rounded-full bg-blue-600 px-2 py-0.5 text-xs text-white">{{
        invitations().length
      }}</span>
    </h2>

    <ul class="m-0 flex list-none flex-col gap-2 p-0">
      @for (inv of invitations(); track inv._id) {
        <li
          class="flex flex-wrap items-center gap-3 rounded-lg border border-blue-100 bg-white p-3"
        >
          <p-avatar
            [image]="inv.teamId.avatarUrl"
            [label]="inv.teamId.avatarUrl ? undefined : inv.teamId.name[0].toUpperCase()"
            shape="square"
            size="large"
          />

          <div class="min-w-0 flex-1">
            <p class="m-0 truncate font-medium text-surface-900">
              {{ inv.teamId.name }}
            </p>
            <p class="m-0 text-sm text-surface-500">
              {{ inviterName(inv) }} invited you as
              <app-role-badge [role]="inv.role" />
            </p>
          </div>

          <div class="flex gap-2">
            <p-button
              label="Decline"
              severity="secondary"
              variant="outlined"
              size="small"
              [disabled]="isBusy(inv)"
              (onClick)="decline(inv)"
            />
            <p-button
              label="Accept"
              icon="pi pi-check"
              size="small"
              [loading]="isBusy(inv)"
              (onClick)="accept(inv)"
            />
          </div>
        </li>
      }
    </ul>
  </section>
}
