<div
  class="bg-white border border-gray-200 rounded-lg p-3 hover:shadow-sm transition space-y-2"
>
  <div class="flex items-start justify-between gap-2">
    <p class="text-sm font-medium text-gray-900">{{ task.title }}</p>
    <div class="flex items-center gap-1 flex-shrink-0">
      <p-button
        icon="pi pi-pencil"
        [text]="true"
        [rounded]="true"
        size="small"
        severity="secondary"
        (click)="onEditClick($event)"
      />
      <p-button
        icon="pi pi-trash"
        [text]="true"
        [rounded]="true"
        size="small"
        severity="danger"
        (click)="onDeleteClick($event)"
      />
    </div>
  </div>

  @if (task.labels.length > 0) {
    <div class="flex flex-wrap gap-1">
      @for (label of task.labels; track label) {
        <span
          class="text-[10px] px-1.5 py-0.5 bg-gray-100 text-gray-600 rounded"
          >{{ label }}</span
        >
      }
    </div>
  }

  <div class="flex items-center justify-between pt-1">
    <app-priority-badge [priority]="task.priority" />

    @if (task.dueDate) {
      <span
        class="text-xs"
        [class.text-red-600]="isOverdue"
        [class.text-gray-400]="!isOverdue"
      >
        {{ task.dueDate | date: "MMM d" }}
      </span>
    }
  </div>

  @if (task.doneAt) {
    <div class="flex items-center gap-1 text-xs text-green-600">
      <i class="pi pi-check-circle text-[11px]"></i>
      <span>Completed {{ task.doneAt | date: "MMM d" }}</span>
    </div>
  }

  @if (assigneeUsers.length > 0) {
    <app-user-avatar-group [users]="assigneeUsers" [max]="3" />
  }
</div>
