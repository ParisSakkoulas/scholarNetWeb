<div class="max-w-5xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold text-gray-900">My Teams</h1>

    <p-button
      (click)="showCreateModal.set(true)"
      label="Create Team"
      icon="pi pi-plus"
    />
  </div>

  <app-generic-table
    #teamsTable
    [columns]="columns"
    [config]="config"
    storageKey="team"
    [fetchPage]="fetchPage"
    [actions]="rowActions"
  />

  @if (showCreateModal()) {
    <app-team-form
      (created)="onTeamCreated($event)"
      (cancelled)="showCreateModal.set(false)"
    />
  }

  @if (editingTeam(); as team) {
    <app-team-form
      [team]="team"
      (updated)="onTeamUpdated()"
      (cancelled)="editingTeam.set(null)"
    />
  }

  <p-confirmdialog />
</div>
