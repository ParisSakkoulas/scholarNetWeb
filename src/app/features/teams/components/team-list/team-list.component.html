<div class="max-w-5xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6">
    <h1 class="text-2xl font-semibold text-gray-900">My Teams</h1>

    <p-button
      (click)="showCreateModal.set(true)"
      label="Create Team"
      icon="pi pi-plus"
    />
  </div>

  @if (loading()) {
    <p class="text-gray-500">Loading teams...</p>
  } @else if (teams().length === 0) {
    <p class="text-gray-500">You're not part of any teams yet.</p>
  } @else {
    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
      @for (team of teams(); track team._id) {
        <p-button
          (click)="openTeam(team._id)"
          styleClass="p-button-outlined p-button-plain w-full !justify-start !text-left !p-4 !h-auto"
        >
          <div class="flex items-center gap-3 w-full">
            @if (team.avatarUrl) {
              <img
                [src]="team.avatarUrl"
                class="w-10 h-10 rounded-lg object-cover"
              />
            } @else {
              <div
                class="w-10 h-10 rounded-lg bg-indigo-100 text-indigo-700 flex items-center justify-center font-semibold"
              >
                {{ team.name[0] }}
              </div>
            }
            <div>
              <p class="font-medium text-gray-900">{{ team.name }}</p>
              <p class="text-xs text-gray-500">{{ team.visibility }}</p>
            </div>
          </div>
        </p-button>
      }
    </div>
  }

  @if (showCreateModal()) {
    <app-team-form
      (created)="onTeamCreated($event)"
      (cancelled)="showCreateModal.set(false)"
    />
  }
</div>
