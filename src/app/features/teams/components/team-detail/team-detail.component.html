<div class="max-w-5xl mx-auto p-6">
  @if (team(); as t) {
    <p-button
      class="back"
      label="Back to teams"
      icon="pi pi-arrow-left"
      variant="text"
      severity="secondary"
      size="small"
      routerLink="/main/teams"
    />

    <section class="th-card">
      <div class="th-cover"></div>
      <div class="th-body">
        <div class="th-avatar">
          @if (t.avatarUrl) {
            <img [src]="t.avatarUrl" [alt]="t.name" />
          } @else {
            {{ initials(t.name) }}
          }
        </div>

        <div class="th-identity">
          <div class="th-title-row">
            <h1 class="th-name">{{ t.name }}</h1>
            <p-tag
              [value]="t.visibility"
              [severity]="visibilitySeverity(t.visibility)"
              [rounded]="true"
            />
          </div>

          @if (t.description) {
            <p class="th-desc">{{ t.description }}</p>
          }

          <div class="th-meta">
            <span
              ><i class="pi pi-hashtag" aria-hidden="true"></i
              >{{ t.slug }}</span
            >
            <span
              ><i class="pi pi-calendar" aria-hidden="true"></i>Created
              {{ t.createdAt | date: "mediumDate" }}</span
            >
          </div>
        </div>

        <div class="th-actions">
          <p-button
            label="Manage Members"
            icon="pi pi-users"
            severity="secondary"
            [outlined]="true"
            (click)="goToMembers()"
          />
        </div>
      </div>
    </section>
  }

  <div class="flex items-center justify-between mb-4">
    <h2 class="text-lg font-medium text-gray-900">Projects</h2>
    <p-button
      label="New Project"
      icon="pi pi-plus"
      (click)="showProjectModal.set(true)"
    />
  </div>

  <app-generic-table
    #projectsTable
    [columns]="columns"
    [config]="config"
    storageKey="project"
    [fetchPage]="fetchPage"
    [actions]="rowActions"
  />

  @if (showProjectModal()) {
    <app-project-form
      [teamId]="teamId"
      (created)="onProjectCreated($event)"
      (cancelled)="showProjectModal.set(false)"
    />
  }
</div>
