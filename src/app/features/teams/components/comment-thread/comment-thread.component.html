<div>
  <h3 class="text-sm font-medium text-gray-700 mb-3">Comments</h3>

  @if (loading()) {
    <p class="text-sm text-gray-400">Loading comments...</p>
  } @else {
    <div class="space-y-3 mb-4 max-h-48 overflow-y-auto">
      @for (comment of comments(); track comment._id) {
        <div class="bg-gray-50 rounded-lg p-3">
          <div class="flex items-center justify-between mb-1">
            <p class="text-xs font-medium text-gray-700">
              {{ authorName(comment) }}
            </p>
            <p class="text-[10px] text-gray-400">
              {{ comment.createdAt | date: "short" }}
            </p>
          </div>
          <p class="text-sm text-gray-800">{{ comment.body }}</p>
        </div>
      } @empty {
        <p class="text-sm text-gray-400">No comments yet.</p>
      }
    </div>
  }

  <div class="flex gap-2">
    <input
      [(ngModel)]="newComment"
      [ngModelOptions]="{ standalone: true }"
      (keydown.enter)="post()"
      placeholder="Write a comment..."
      class="flex-1 border border-gray-300 rounded-lg px-3 py-2 text-sm"
    />
    <button
      (click)="post()"
      [disabled]="posting()"
      class="px-3 py-2 bg-indigo-600 text-white rounded-lg text-sm font-medium hover:bg-indigo-700 disabled:opacity-50"
    >
      Send
    </button>
  </div>
</div>
