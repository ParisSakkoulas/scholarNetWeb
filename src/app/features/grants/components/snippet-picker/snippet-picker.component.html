<p-dialog
  [visible]="true"
  [modal]="true"
  [style]="{ width: '40rem', maxWidth: '95vw' }"
  [header]="sectionTitle ? 'Snippets for ' + sectionTitle : 'Snippets'"
  (visibleChange)="!$event && closed.emit()"
>
  <div class="mb-3 grid gap-2 sm:grid-cols-2">
    <input pInputText [ngModel]="search()" (ngModelChange)="search.set($event)" placeholder="Search" aria-label="Search snippets" class="w-full" />
    <p-select [ngModel]="type()" (ngModelChange)="type.set($event)" [options]="typeChoices" optionLabel="label" optionValue="value" styleClass="w-full" ariaLabel="Type" appendTo="body" />
  </div>

  @if (loading()) {
    <p-skeleton height="8rem" />
  } @else if (loadError()) {
    <p class="m-0 text-sm text-red-600">Could not load your snippets.</p>
  } @else if (!shown().length) {
    <p class="m-0 text-sm text-surface-500">Nothing here yet. Save text you reuse in the snippet library.</p>
  } @else {
    <ul class="m-0 flex max-h-96 list-none flex-col gap-2 overflow-y-auto p-0">
      @for (s of shown(); track s._id) {
        <li class="rounded-lg border border-surface-200 p-3">
          <div class="flex items-start justify-between gap-2">
            <div class="min-w-0">
              <p class="m-0 text-sm font-medium text-surface-900">{{ s.title }}</p>
              <p class="m-0 mt-1 flex gap-1">
                <p-tag [value]="typeLabel[s.type]" severity="info" />
                <p-tag [value]="s.teamId ? s.teamId.name : 'Personal'" severity="secondary" />
              </p>
            </div>
            <p-button [label]="copiedId() === s._id ? 'Copied' : 'Copy'" [icon]="copiedId() === s._id ? 'pi pi-check' : 'pi pi-copy'" size="small" (onClick)="copy(s)" />
          </div>
          <p class="m-0 mt-2 line-clamp-4 whitespace-pre-line text-xs text-surface-600">{{ s.content }}</p>
        </li>
      }
    </ul>
  }

  <div class="mt-3 text-right">
    <a routerLink="/main/snippets" class="text-sm text-primary-600" (click)="closed.emit()">Manage snippets <i class="pi pi-arrow-right text-xs" aria-hidden="true"></i></a>
  </div>
</p-dialog>
