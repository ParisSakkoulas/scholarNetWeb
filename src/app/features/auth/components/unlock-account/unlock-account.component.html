<div class="flex min-h-screen items-center justify-center px-4">
  <p-card styleClass="w-full max-w-md text-center">
    @switch (state()) {
      @case ("loading") {
        <div class="flex flex-col items-center gap-3 py-4">
          <p-progressSpinner
            strokeWidth="4"
            styleClass="!h-12 !w-12"
            ariaLabel="Unlocking your account"
          />
          <h1 class="text-xl font-semibold">Unlocking your account...</h1>
          <p class="text-sm text-surface-500">Please wait a moment.</p>
        </div>
      }

      @case ("success") {
        <div class="flex flex-col items-center gap-3 py-4">
          <i class="pi pi-lock-open text-5xl text-green-500"></i>
          <h1 class="text-xl font-semibold">Your account is unlocked</h1>
          <p class="text-sm text-surface-500">
            You can now log in with your password.
          </p>
          <p-button
            label="Go to login"
            icon="pi pi-sign-in"
            routerLink="/auth/login"
            styleClass="mt-4"
          />
        </div>
      }

      @case ("error") {
        <div class="flex flex-col items-center gap-3 py-4">
          <h1 class="text-xl font-semibold">This link is not valid</h1>
          <p-message
            severity="error"
            text="The unlock link is invalid, expired, or was already used."
            styleClass="w-full"
          />
          <div class="mt-4 flex w-full flex-col gap-3">
            <p-button
              label="Reset my password"
              routerLink="/auth/forgot-password"
              styleClass="w-full"
            />
            <p-button
              label="Back to login"
              [text]="true"
              routerLink="/auth/login"
              styleClass="w-full"
            />
          </div>
        </div>
      }
    }
  </p-card>
</div>
