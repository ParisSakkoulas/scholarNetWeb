<p-dialog
  [visible]="true"
  [modal]="true"
  [draggable]="false"
  [dismissableMask]="true"
  header="Connections"
  [style]="{ width: '34rem' }"
  [breakpoints]="{ '768px': '95vw' }"
  (visibleChange)="closed.emit()"
>
  <div class="flex min-h-[26rem] flex-col gap-4">
    <p-selectbutton
      [options]="modeOptions"
      [(ngModel)]="mode"
      optionLabel="label"
      optionValue="value"
      [allowEmpty]="false"
      (onChange)="load(1)"
    />

    <ul class="m-0 flex-1 list-none divide-y divide-surface-200 p-0">
      @if (loading()) {
        <li class="py-10 text-center text-surface-500">
          <i class="pi pi-spin pi-spinner" aria-hidden="true"></i>
        </li>
      } @else {
        @for (u of users(); track u._id) {
          <li>
            <a
              class="flex items-center gap-3 px-1 py-3 text-inherit no-underline hover:bg-surface-100"
              [routerLink]="['/main/profile', u._id]"
              (click)="closed.emit()"
            >
              <p-avatar
                [image]="u.profilePhotoUrl"
                [label]="u.profilePhotoUrl ? undefined : initials(u)"
                shape="circle"
                size="large"
              />
              <span class="min-w-0">
                <span class="block truncate font-medium text-surface-900"
                  >{{ u.firstName }} {{ u.lastName }}</span
                >
                <span class="block truncate text-sm text-surface-500"
                  >&#64;{{ u.username }}</span
                >
              </span>
            </a>
          </li>
        } @empty {
          <li class="flex flex-col items-center gap-2 py-12 text-surface-500">
            <i class="pi pi-users text-3xl" aria-hidden="true"></i>
            <span>
              {{
                mode === "followers"
                  ? "No followers yet."
                  : "Not following anyone yet."
              }}
            </span>
          </li>
        }
      }
    </ul>

    @if (total() > pageSize) {
      <p-paginator
        [rows]="pageSize"
        [totalRecords]="total()"
        [first]="(page() - 1) * pageSize"
        (onPageChange)="onPageChange($event)"
      />
    }
  </div>
</p-dialog>
