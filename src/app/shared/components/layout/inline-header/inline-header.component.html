<header class="app-header">
  <!-- Brand -->
  <a class="brand" routerLink="/" aria-label="scholarNet home">
    <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
      <g transform="translate(0,4)">
        <g stroke="currentColor" stroke-width="1.1" opacity="0.55" fill="none">
          <line x1="22" y1="26" x2="56" y2="14" />
          <line x1="22" y1="26" x2="40" y2="60" />
          <line x1="56" y1="14" x2="78" y2="46" />
          <line x1="78" y1="46" x2="40" y2="60" />
          <line x1="40" y1="60" x2="14" y2="64" />
          <line x1="40" y1="60" x2="60" y2="86" />
          <line x1="78" y1="46" x2="86" y2="76" />
          <line x1="86" y1="76" x2="60" y2="86" />
        </g>
        <circle cx="22" cy="26" r="3.2" fill="currentColor" />
        <circle cx="56" cy="14" r="3.2" fill="currentColor" />
        <circle cx="78" cy="46" r="3.2" fill="currentColor" />
        <circle cx="40" cy="60" r="5" class="accent" />
        <circle cx="14" cy="64" r="3.2" fill="currentColor" />
        <circle cx="86" cy="76" r="3.2" fill="currentColor" />
        <circle cx="60" cy="86" r="3.2" fill="currentColor" />
      </g>
    </svg>
    <span class="wordmark">scholar<b>Net</b></span>
  </a>

  <!-- Search -->
  <div class="search" role="search">
    <p-iconfield>
      <p-inputicon class="pi pi-search" />
      <input
        #searchInput
        pInputText
        type="text"
        class="search-input"
        aria-label="Search"
        placeholder="Search researchers, papers, materials"
        (keydown.enter)="onSearchSubmit(searchInput.value)"
      />
    </p-iconfield>
    <kbd class="search-kbd" aria-hidden="true">⌘ K</kbd>
  </div>

  @if (currentUser(); as user) {
    <nav class="actions" aria-label="Main">
      <a routerLink="/library" routerLinkActive="is-active" class="nav-link"
        >My library</a
      >
      <a routerLink="/network" routerLinkActive="is-active" class="nav-link"
        >Network</a
      >
      <a routerLink="/main/teams" routerLinkActive="is-active" class="nav-link"
        >Teams</a
      >

      <!-- Notifications -->
      <p-button
        icon="pi pi-bell"
        variant="text"
        severity="secondary"
        rounded
        ariaLabel="Notifications"
        (onClick)="notifications.toggle($event)"
      />
      <p-popover #notifications>
        <div class="notif">
          <h2 class="notif-title">Notifications</h2>
          <p class="notif-empty">You're all caught up.</p>
        </div>
      </p-popover>

      <!-- Profile menu -->
      <button
        type="button"
        class="avatar-btn"
        aria-label="Account menu"
        aria-haspopup="menu"
        (click)="profileMenu.toggle($event)"
      >
        <p-avatar [label]="initials()" shape="circle" />
      </button>
      <p-menu #profileMenu [model]="profileItems" [popup]="true">
        <ng-template #start>
          <div class="menu-identity">
            <div class="menu-name">
              {{ user.firstName }} {{ user.lastName }}
            </div>
            <div class="menu-email">{{ user.email }}</div>
          </div>
        </ng-template>
      </p-menu>
    </nav>
  } @else {
    <nav class="actions" aria-label="Account">
      <p-button
        label="Log in"
        variant="text"
        severity="secondary"
        routerLink="/login"
      />
      <p-button label="Sign up" rounded routerLink="/register" />
    </nav>
  }
</header>
