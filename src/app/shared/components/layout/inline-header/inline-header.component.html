<header class="app-header">

    <!-- Brand -->
    <a class="brand" routerLink="/">
        <svg class="mark" viewBox="0 0 100 100" aria-hidden="true">
            <g transform="translate(0,4)">
                <g stroke="currentColor" stroke-width="1.1" opacity="0.55" fill="none">
                    <line x1="22" y1="26" x2="56" y2="14" />
                    <line x1="22" y1="26" x2="40" y2="60" />
                    <line x1="56" y1="14" x2="78" y2="46" />
                    <line x1="78" y1="46" x2="40" y2="60" />
                    <line x1="40" y1="60" x2="14" y2="64" />
                    <line x1="40" y1="60" x2="60" y2="86" />
                    <line x1="78" y1="46" x2="86" y2="76" />
                    <line x1="86" y1="76" x2="60" y2="86" />
                </g>
                <circle cx="22" cy="26" r="3.2" fill="currentColor" />
                <circle cx="56" cy="14" r="3.2" fill="currentColor" />
                <circle cx="78" cy="46" r="3.2" fill="currentColor" />
                <circle cx="40" cy="60" r="5.0" class="accent" />
                <circle cx="14" cy="64" r="3.2" fill="currentColor" />
                <circle cx="86" cy="76" r="3.2" fill="currentColor" />
                <circle cx="60" cy="86" r="3.2" fill="currentColor" />
            </g>
        </svg>
        <span class="wm">scholar<i>N</i>et</span>
    </a>


    <div class="search">
        <svg class="search__icon" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="7" cy="7" r="5.25" stroke="currentColor" stroke-width="1.3" />
            <path d="M11 11 L14.5 14.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" />
        </svg>
        <input #searchInput type="text" class="search__input" placeholder="Search researchers, papers, materials"
            (keydown.enter)="onSearchSubmit(searchInput.value)" />
        <kbd class="search__shortcut"><span>⌘</span><span>K</span></kbd>
    </div>
    @if (currentUser(); as user) {
    <nav class="actions">
        <a routerLink="/library" class="actions__link">My library</a>
        <a routerLink="/network" class="actions__link">Network</a>

        <div class="notification-menu" (appClickOutside)="notificationMenuOpen.set(false)">
            <button type="button" class="notificationButton" (click)="toggleNotifications()" aria-haspopup="menu"
                [attr.aria-expanded]="notificationMenuOpen()"><i class="pi pi-bell"
                    style="font-size: 1rem"></i></button>

            @if (notificationMenuOpen()) {
            <div class="notification-menu__panel" role="menu">
                <div class="notification-menu__identity">
                    <div class="profile-menu__name">Notifications</div>
                </div>
            </div>
            }
        </div>



        <div class="profile-menu" (appClickOutside)="profileMenuOpen.set(false)">
            <button type="button" class="avatar" (click)="toggleProfileMenu()" ...>{{ initials() }}</button>
            @if (profileMenuOpen()) {
            <div class="profile-menu__panel" role="menu">
                <div class="profile-menu__identity">
                    <div class="profile-menu__name">{{ user.firstName }} {{ user.lastName }}</div>
                    <div class="profile-menu__email">{{ user.email }}</div>
                </div>

                <button type="button" class="profile-menu__item" role="menuitem"
                    (click)="goToOwnProfile(); profileMenuOpen.set(false)">View profile</button>

                <a routerLink="/settings" class="profile-menu__item" role="menuitem"
                    (click)="profileMenuOpen.set(false)">Settings</a>

                <a routerLink="/settings" class="profile-menu__item" role="menuitem"
                    (click)="profileMenuOpen.set(false)">Activity</a>
                <!-- <a routerLink="/profile/cv" class="profile-menu__item" role="menuitem"
                    (click)="profileMenuOpen.set(false)">Generate CV</a> -->


                <!-- @if (isAdmin()) {
                    <a routerLink="/admin" class="profile-menu__item" role="menuitem" (click)="profileMenuOpen.set(false)">Admin panel</a>
                    } -->

                <div class="profile-menu__divider"></div>

                <button type="button" class="profile-menu__item profile-menu__logout" role="menuitem"
                    (click)="logout()">Log out</button>
            </div>
            }
        </div>
    </nav>
    }@else {
    <nav class="actions">
        <a routerLink="/login" class="actions__link">Log in</a>
        <a routerLink="/register" class="btn-signup">Sign up</a>
    </nav>
    }

</header>
